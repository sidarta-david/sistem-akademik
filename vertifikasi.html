<!DOCTYPE html>
<html>
<head>
    <title>Verifikasi OTP</title>
</head>
<body>
    <h2>Langkah Terakhir!</h2>
    <p>Kami telah mengirimkan 6 digit angka ke nomor HP Anda.</p>

    <form action="berhasil.html">
        <label>Kode OTP:</label>
        <!-- Hanya bisa diketik maksimal 6 karakter -->
        <input type="text" maxlength="6" placeholder="123456" required>
        <br><br>
        <button type="submit">Verifikasi & Masuk</button>
    </form>
</body>
</html>
